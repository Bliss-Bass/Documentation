# POS / panel / kiosk retail brands (user catalog).
# Not derived from linuxhw — used to show presence/absence in the DMI tree.
# needles: case-insensitive substrings matched against DMI vendor (and path) fields.
# guidance: short buyer tip for Bass x86 (open iGPU path).

default_guidance: >
  Intel or AMD built-in graphics from roughly the last decade or more
  are expected to work. Extra screens are usually handled by Display Mapper
  and Input Mapper. Test USB, serial, and CAN store devices with your
  Android app on that model. Skip machines that need a separate NVIDIA
  graphics card.

brands:
  # --- Retail / channel POS & panel (user list) ---
  - name: POSNation
    needles: ["posnation", "pos nation"]
    notes: Channel/reseller POS systems; usually rebadge Intel AiOs.
  - name: Barcodes Inc.
    needles: ["barcodes inc", "barcodesinc"]
    notes: Reseller; hardware often third-party Intel panels.
  - name: Newegg Business
    needles: ["newegg"]
    notes: Reseller/channel; DMI usually shows the ODM or panel OEM.
  - name: Elo Touch
    needles: ["elo touch", "elo touch solutions", "elotouch"]
    notes: Touch AiO / kiosk panels; Intel iGPU SKUs fit Mesa.
  - name: POSGuys
    needles: ["posguys", "pos guys"]
    notes: Reseller; treat underlying Intel/AMD panel as the real target.
  - name: Sunany
    needles: ["sunany"]
    notes: Panel/POS OEM; uncommon in Linux probe datasets.
  - name: POS Catch
    needles: ["pos catch", "poscatch"]
    notes: Channel POS kits; verify GPU before deploy.
  - name: Alibaba
    needles: ["alibaba"]
    notes: Marketplace listings — DMI is whatever ODM flashed; not a single OEM.
  - name: Aonpos
    needles: ["aonpos"]
    notes: POS terminals; rare Linux probes.
  - name: Gilong
    needles: ["gilong"]
    notes: POS/panel OEM; rare in linuxhw.
  - name: Tysso
    needles: ["tysso"]
    notes: POS terminals; rare Linux uploads.
  - name: Jassway
    needles: ["jassway"]
    notes: Panel PC / POS; rare in linuxhw.
  - name: Beetronics
    needles: ["beetronics"]
